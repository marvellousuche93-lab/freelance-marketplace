<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#338bff" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Site-wide defaults. Individual pages override these with JS
         via <Seo />. Social crawlers that don't run JS will still see
         these values — good enough for a friendly preview. -->
    <title>Freelance Marketplace — Find great work. Hire great people.</title>
    <meta
      name="description"
      content="A freelance and job marketplace where freelancers publish portfolios and apply to jobs, and employers post work and hire talent."
    />
    <link rel="canonical" href="https://freelance-marketplace-lac-psi.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Freelance Marketplace — Find great work. Hire great people." />
    <meta property="og:description" content="A freelance and job marketplace where freelancers publish portfolios and apply to jobs, and employers post work and hire talent." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freelance Marketplace" />
    <meta property="og:url" content="https://freelance-marketplace-lac-psi.vercel.app/" />
    <meta property="og:image" content="https://freelance-marketplace-lac-psi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Freelance Marketplace" />
    <meta name="twitter:description" content="Find great work. Hire great people." />
    <meta name="twitter:image" content="https://freelance-marketplace-lac-psi.vercel.app/og-image.png" />

    <!-- Prevent iOS from auto-linking phone numbers in some contexts -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
